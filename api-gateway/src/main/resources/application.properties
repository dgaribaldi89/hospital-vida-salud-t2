spring.application.name=api-gateway

server.port=8080

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Ruta hacia MS-PACIENTES
spring.cloud.gateway.server.webflux.routes[0].id=ms-pacientes
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MS-PACIENTES
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/pacientes/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# Ruta hacia MS-CITAS
spring.cloud.gateway.server.webflux.routes[1].id=ms-citas
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MS-CITAS
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/citas/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
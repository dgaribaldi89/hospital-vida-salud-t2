spring.application.name=ms-citas

server.port=8082

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# PostgreSQL - R2DBC
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/hospital_citas
spring.r2dbc.username=postgres
spring.r2dbc.password=${DB_PASSWORD}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Manejo de errores
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
spring.web.error.include-path=always
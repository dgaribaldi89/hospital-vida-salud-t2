spring.application.name=ms-citas

server.port=8082

# ==============================
# EUREKA DISCOVERY
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==============================
# POSTGRESQL - R2DBC
# ==============================
spring.r2dbc.url=${CITAS_DB_URL:r2dbc:postgresql://localhost:5432/hospital_citas}
spring.r2dbc.username=${DB_USER:postgres}
spring.r2dbc.password=${DB_PASSWORD:}

# ==============================
# RABBITMQ
# ==============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# ==============================
# MANEJO DE ERRORES
# ==============================
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
spring.web.error.include-path=always
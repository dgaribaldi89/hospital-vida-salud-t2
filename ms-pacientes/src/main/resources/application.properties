spring.application.name=ms-pacientes

server.port=8081

# ==============================
# EUREKA DISCOVERY
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==============================
# POSTGRESQL - R2DBC
# ==============================
spring.r2dbc.url=${PACIENTES_DB_URL:r2dbc:postgresql://localhost:5432/hospital_pacientes}
spring.r2dbc.username=${DB_USER:postgres}
spring.r2dbc.password=${DB_PASSWORD:}

# ==============================
# MANEJO DE ERRORES
# ==============================
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
spring.web.error.include-path=always